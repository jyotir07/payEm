# GitHub Actions CI workflow for payments-platform. Runs on push and pull_request.
# Responsibility: Format check, lint, and tests for all services and frontend.

name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  api-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.21'
      - name: Lint
        run: cd services/api-gateway && go vet ./...
      - name: Test
        run: cd services/api-gateway && go test ./...

  payments-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and Test
        run: cd services/payments-core && ./gradlew build --no-daemon

  ledger-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Build and Test
        run: cd services/ledger-service && sbt test

  webhook-service:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          bundler-cache: true
      - name: Lint
        run: cd services/webhook-service && bundle exec rubocop
      - name: Test
        run: cd services/webhook-service && bundle exec rspec

  admin-dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/admin-dashboard/package-lock.json
      - name: Install
        run: cd frontend/admin-dashboard && npm ci
      - name: Lint
        run: cd frontend/admin-dashboard && npm run lint
      - name: Test
        run: cd frontend/admin-dashboard && npm run test
