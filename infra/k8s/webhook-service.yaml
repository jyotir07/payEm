# Kubernetes Deployment for webhook-service. Defines replicas, image, env, health checks.
# Responsibility: Runtime definition for webhook-service.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: webhook-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: webhook-service
  template:
    metadata:
      labels:
        app: webhook-service
    spec:
      containers:
        - name: webhook-service
          image: payments-platform/webhook-service:latest
          ports:
            - containerPort: 9292
