# Kubernetes Deployment for ledger-service. Defines replicas, image, env, health checks.
# Responsibility: Runtime definition for ledger-service.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: ledger-service
spec:
  replicas: 2
  selector:
    matchLabels:
      app: ledger-service
  template:
    metadata:
      labels:
        app: ledger-service
    spec:
      containers:
        - name: ledger-service
          image: payments-platform/ledger-service:latest
          ports:
            - containerPort: 8082
