# Kubernetes Deployment for api-gateway. Responsibility: Runtime definition for api-gateway.

apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api-gateway
  template:
    metadata:
      labels:
        app: api-gateway
    spec:
      containers:
        - name: api-gateway
          image: payments-platform/api-gateway:latest
          ports:
            - containerPort: 8080
