// Build configuration for payments-core. Defines Java version, dependencies,
// and tasks for compilation, tests, and packaging. Responsibility: Language-specific build.

plugins {
    id 'java'
    id 'application'
}

group = 'com.payments-platform'
version = '1.0.0'

java {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
}

repositories {
    mavenCentral()
}

dependencies {
    // Phase 2: PostgreSQL JDBC driver and connection pool
    implementation 'org.postgresql:postgresql:42.7.3'
    implementation 'com.zaxxer:HikariCP:5.1.0'

    // Phase 3: HTTP server (Javalin) + JSON (Jackson)
    implementation 'io.javalin:javalin:6.3.0'
    implementation 'com.fasterxml.jackson.core:jackson-databind:2.17.2'
    implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310:2.17.2'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.13'

    // Testing
    testImplementation platform('org.junit:junit-bom:5.10.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    // Phase 2: Testcontainers for integration tests
    testImplementation platform('org.testcontainers:testcontainers-bom:1.19.8')
    testImplementation 'org.testcontainers:postgresql'
    testImplementation 'org.testcontainers:junit-jupiter'
}

// Expose the migrations directory as a classpath resource for integration tests.
sourceSets {
    main {
        resources {
            srcDirs += ['migrations']
        }
    }
}

application {
    mainClass = 'com.paymentsplatform.paymentscore.Application'
}

test {
    useJUnitPlatform()
}
